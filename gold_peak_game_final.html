<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold Peak Challenge</title>
<style>
:root{--bg:#faf8f3;--fg:#1f1d18;--mut:#6b675c;--card:#fff;--line:#e2ddd0;--acc:#b8860b;--bad:#b3261e;--ok:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16150f;--fg:#f1eee4;--mut:#a29e90;--card:#201f17;--line:#38362a;--acc:#e0b13a;--bad:#ff8a80;--ok:#81c784}}
:root[data-theme="dark"]{--bg:#16150f;--fg:#f1eee4;--mut:#a29e90;--card:#201f17;--line:#38362a;--acc:#e0b13a;--bad:#ff8a80;--ok:#81c784}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:2px}
input,select,textarea,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=text],input[type=number]{width:100%}
textarea{width:100%;min-height:90px;font-family:ui-monospace,monospace;font-size:.8rem}
button{cursor:pointer;background:var(--acc);color:#1b1500;border-color:var(--acc);font-weight:600}
button.sec{background:transparent;color:var(--fg);border-color:var(--line);font-weight:400}
.row{display:grid;grid-template-columns:90px 1fr 110px;gap:10px;align-items:end;margin-bottom:8px}
.msg{margin-top:10px;font-size:.9rem}.err{color:var(--bad)}.ok{color:var(--ok)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>Gold Peak Challenge</h1>

<div class="card">
  <h2>Leaderboard</h2>
  <div class="scroll"><table>
    <thead><tr><th>#</th><th>Team</th><th class="n">Portfolio value</th><th class="n">% of perfect</th><th id="adh" hidden></th></tr></thead>
    <tbody id="lb"></tbody>
  </table></div>
</div>

<div class="card" id="admin" hidden>
  <h2>Organizer: price data</h2>
  <p class="mut" style="margin-top:0">Paste monthly CSV rows: <code>YYYY-MM,real_price</code> (already inflation adjusted), covering 1970–2019.</p>
  <textarea id="csv" placeholder="1970-01,245.30"></textarea>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
    <button id="load">Load &amp; save data</button>
  </div>
  <div class="msg" id="dmsg"></div>
</div>

<div class="card">
  <h2>Answer sheet</h2>
  <label for="team">Team name</label>
  <input type="text" id="team" maxlength="40" autocomplete="off">
  <div style="height:12px"></div>
  <div id="rows"></div>
  <button id="submit">Submit answer sheet</button>
  <div class="msg" id="smsg"></div>
</div>
</main>

<script>
const DEC=[[1970,1979],[1980,1989],[1990,1999],[2000,2009],[2010,2019]];
let series=[],peaks=[],bases=[],subs=[],db=null,admin=true;

function parseCSV(t){
  const rows=[];
  t.split(/\r?\n/).forEach(l=>{
    const p=l.split(/[,;\t]/).map(s=>s.trim());
    const m=/^(\d{4})-(\d{1,2})/.exec(p[0]);
    const d=m?Date.UTC(+m[1],+m[2]-1,1):NaN, real=parseFloat(p[1]);
    if(!isNaN(d)&&real>0)rows.push({t:d,y:new Date(d).getUTCFullYear(),real});
  });
  rows.sort((a,b)=>a.t-b.t);
  return rows;
}

function setData(text){
  series=parseCSV(text);
  bases=DEC.map(([a,b])=>series.find(r=>r.y>=a&&r.y<=b));
  peaks=DEC.map(([a,b])=>{
    let best=null;
    series.forEach(r=>{if(r.y>=a&&r.y<=b&&(!best||r.real>best.real))best=r});
    return best;
  });
  render();
  return series.length&&peaks.every(Boolean)&&bases.every(Boolean);
}
const fmt=v=>v.toLocaleString("en-US",{maximumFractionDigits:1});

// Index of the chosen month vs the decade's first price (first price = 100)
function idxAt(i,dateStr){
  const [a,b]=DEC[i],t=Date.parse(dateStr);
  let best=null;
  series.forEach(r=>{if(r.y>=a&&r.y<=b&&(!best||Math.abs(r.t-t)<Math.abs(best.t-t)))best=r});
  return best&&bases[i]?100*best.real/bases[i].real:0;
}
function score(s){
  let v=0,m=0;
  for(let i=0;i<5;i++){
    v+=s.amounts[i]*idxAt(i,s.dates[i])/100;
    m+=bases[i]&&peaks[i]?s.amounts[i]*peaks[i].real/bases[i].real:0;
  }
  return {v,pct:m?100*v/m:0};
}

function buildRows(){
  const el=document.getElementById("rows");
  el.innerHTML=DEC.map((d,i)=>`<div class="row"><div><label>Decade</label>${d[0]}s</div>
  <div><label for="d${i}">Month of peak</label><input type="month" id="d${i}" min="${d[0]}-01" max="${d[1]}-12" placeholder="YYYY-MM"></div>
  <div><label for="a${i}">Invest</label><input type="number" id="a${i}" min="0" step="1" value="0"></div></div>`).join("");
}

function render(){
  const lb=document.getElementById("lb");
  const ranked=subs.filter(s=>s.amounts).map(s=>({...s,...score(s)})).sort((a,b)=>b.v-a.v);
  document.getElementById("adh").hidden=!admin||!db;
  lb.innerHTML=ranked.length?ranked.map((s,i)=>`<tr><td>${i+1}</td><td></td><td class="n">${series.length?fmt(s.v):"–"}</td><td class="n">${series.length?s.pct.toFixed(1)+"%":"–"}</td>${admin&&db?`<td><button class="sec" data-del="${s.id}">Delete</button></td>`:""}</tr>`).join(""):`<tr><td colspan="4" class="mut">No submissions yet.</td></tr>`;
  [...lb.querySelectorAll("tr")].forEach((tr,i)=>{if(ranked[i]&&tr.cells[1])tr.cells[1].textContent=ranked[i].team});
  lb.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>db.collection("submissions").doc(b.dataset.del).delete());
}

function msg(id,text,cls){const e=document.getElementById(id);e.textContent=text;e.className="msg "+(cls||"")}

document.getElementById("submit").onclick=async()=>{
  const team=document.getElementById("team").value.trim();
  const dates=DEC.map((_,i)=>document.getElementById("d"+i).value);
  const amounts=DEC.map((_,i)=>Number(document.getElementById("a"+i).value));
  if(!team)return msg("smsg","Enter a team name.","err");
  if(dates.some(d=>!/^\d{4}-\d{2}$/.test(d)))return msg("smsg","Fill in all five months (YYYY-MM).","err");
  for(let i=0;i<5;i++){const y=+dates[i].slice(0,4);if(y<DEC[i][0]||y>DEC[i][1])return msg("smsg","Month "+(i+1)+" must be in the "+DEC[i][0]+"s.","err")}
  if(amounts.some(a=>!Number.isInteger(a)||a<0))return msg("smsg","Each amount must be a whole number, 0 or more.","err");
  if(amounts.every(a=>a===0))return msg("smsg","Invest something in at least one decade.","err");
  if(!series.length)return msg("smsg","The organizer hasn’t loaded price data yet.","err");
  const sheet={team,dates,amounts,ts:Date.now()};
  try{
    if(db)await db.collection("submissions").add(sheet);
    else{sheet.id="l"+subs.length;subs.push(sheet);render()}
    msg("smsg","Submitted! Check the leaderboard.","ok");
  }catch(e){msg("smsg","Could not submit: "+(e.message||e.code||"error"),"err")}
};

document.getElementById("load").onclick=async()=>{
  const text=document.getElementById("csv").value;
  if(!setData(text))return msg("dmsg","Need rows with valid dates in every decade 1970–2019.","err");
  try{if(db)await db.doc("config/data").set({csv:text});document.getElementById("admin").hidden=true}
  catch(e){msg("dmsg","Loaded locally, but saving failed: "+(e.message||e.code),"err")}
};

buildRows();render();
(async()=>{
  try{
    const u=window.claude&&await claude.use("user");
    db=window.claude&&await claude.use("db");
    admin=db?!!(u&&u.isOwner()):true;
  }catch(e){db=null;admin=true}
  document.getElementById("admin").hidden=!admin;
  if(db){
    db.doc("config/data").onSnapshot(s=>{if(s.exists){const t=s.data().csv;document.getElementById("csv").value=t;setData(t)}});
    db.collection("submissions").onSnapshot(s=>{subs=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  }
  render();
})();
</script>
</body>
</html>
